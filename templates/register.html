<!DOCTYPE html>
<html>
<head>
  <title>AkuOS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/akuos-favicon.svg') }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background:
        radial-gradient(circle at top, rgba(34, 211, 238, 0.16), transparent 28%),
        linear-gradient(180deg, #06101c, #020617);
      color: #e5e7eb;
      font-family: Inter, system-ui, -apple-system, sans-serif;
    }
    .center-box {
      max-width: 380px;
      margin: 12vh auto;
      padding: 30px;
      border-radius: 18px;
      background: rgba(15,23,42,0.9);
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      border: 1px solid rgba(148,163,184,0.4);
    }
    input {
      background: rgba(15,23,42,0.9) !important;
      border: 1px solid rgba(148,163,184,0.6) !important;
      color: #e5e7eb !important;
    }
    .btn-success {
      background: linear-gradient(90deg, #22d3ee, #3b82f6);
      border: none;
      font-weight: 600;
      border-radius: 10px;
      color: #03111d;
    }
    a {
      color: #7dd3fc;
      text-decoration: none;
    }
    .auth-brand {
      display: grid;
      justify-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .auth-logo {
      width: 76px;
      height: 76px;
      border-radius: 18px;
      object-fit: contain;
      filter: drop-shadow(0 14px 28px rgba(34, 211, 238, 0.18));
    }
    .toggle-line {
      color: #cbd5e1;
      font-size: 0.92rem;
    }
    .alert {
      border-radius: 12px;
      background: rgba(127, 29, 29, 0.28);
      border-color: rgba(248, 113, 113, 0.22);
      color: #fecaca;
    }
    .auth-footer {
      margin-top: 18px;
      color: #94a3b8;
      font-size: 0.88rem;
      text-align: center;
    }
  </style>
  <link href="{{ url_for('static', filename='css/fintech-polish.css') }}" rel="stylesheet">
</head>
<body>

<div class="center-box">
  <div class="auth-brand">
    <img class="auth-logo" src="{{ url_for('static', filename='img/akuos-logo.svg') }}" alt="AkuOS">
    <h3 class="mb-0 text-center">AkuOS</h3>
  </div>
  <p class="text-muted text-center mb-4">Create your account</p>
  {% if register_error %}
    <div class="alert alert-danger mb-3">{{ register_error }}</div>
  {% endif %}
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input class="form-control mb-3" name="username" placeholder="Username" value="{{ username_value or '' }}" required>
    <input class="form-control mb-2" id="register-password" type="password" name="password" placeholder="Password" required>
    <div class="toggle-line mb-4">
      <label class="mb-0"><input type="checkbox" id="show-register-password"> Show password</label>
    </div>
    <button class="btn btn-success w-100 mb-3">Register</button>
  </form>
  <div class="text-center">
    <a href="{{ url_for('login') }}" target="_self">Back to login</a>
  </div>
  <footer class="auth-footer">
    <a href="{{ url_for('privacy') }}" target="_self">Privacy</a>
    <span aria-hidden="true"> · </span>
    <a href="{{ url_for('security') }}" target="_self">Security</a>
    <span aria-hidden="true"> · </span>
    <a href="{{ url_for('terms') }}" target="_self">Terms</a>
  </footer>
</div>

<script>
  const registerPasswordToggle = document.getElementById('show-register-password');
  const registerPasswordInput = document.getElementById('register-password');
  if (registerPasswordToggle && registerPasswordInput) {
    registerPasswordToggle.addEventListener('change', () => {
      registerPasswordInput.type = registerPasswordToggle.checked ? 'text' : 'password';
    });
  }
</script>
</body>
</html>
