<script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
<script>
  (() => {
    const connectBankButtons = Array.from(
      document.querySelectorAll('#connect-bank-button, [data-plaid-connect-button]')
    ).filter(Boolean);
    const connectFeedbackStorageKey = 'akuos-plaid-connect-feedback';
    const csrfToken = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '';

    if (!connectBankButtons.length || connectBankButtons.every((button) => button.disabled)) {
      return;
    }

    const setConnectLoading = (isLoading) => {
      connectBankButtons.forEach((button) => {
        if (!button.dataset.originalHtml) {
          button.dataset.originalHtml = button.innerHTML;
        }
        button.disabled = isLoading;
        button.innerHTML = isLoading
          ? '<i class="bi bi-arrow-repeat"></i><span>Connecting...</span>'
          : button.dataset.originalHtml;
      });
    };

    const buildConnectFeedbackMessage = (payload) => {
      const institutionName = (payload?.institution_name || 'your bank').trim();
      const addedNames = Array.isArray(payload?.accounts_added_names) ? payload.accounts_added_names.filter(Boolean) : [];
      const skippedNames = Array.isArray(payload?.accounts_skipped_names) ? payload.accounts_skipped_names.filter(Boolean) : [];
      const addedCount = Number(payload?.accounts_created || 0);
      const skippedCount = Number(payload?.accounts_skipped || 0);
      const details = [];
      if (addedCount > 0) {
        details.push(`Added ${addedCount} account${addedCount === 1 ? '' : 's'}.`);
      } else {
        details.push('No new accounts were added.');
      }
      if (skippedCount > 0) {
        details.push(`Skipped ${skippedCount} already linked account${skippedCount === 1 ? '' : 's'}.`);
      }
      return {
        tone: 'success',
        title: `Connected ${institutionName}.`,
        meta: addedCount > 0
          ? details.join(' ')
          : `Bank connected successfully. No new accounts were added because all selected accounts were already linked.${skippedCount > 0 ? ` Skipped ${skippedCount} account${skippedCount === 1 ? '' : 's'}.` : ''}`,
        addedNames,
        skippedNames
      };
    };

    const openPlaid = async (event) => {
      const triggerButton = event?.currentTarget || null;
      const plaidItemId = (triggerButton?.dataset?.plaidItemId || '').trim();
      if (triggerButton?.disabled) return;
      event?.preventDefault?.();
      setConnectLoading(true);
      try {
        if (!window.Plaid || typeof window.Plaid.create !== 'function') {
          throw new Error('Plaid Link could not load. Refresh the page and try again.');
        }
        const tokenResponse = await fetch('{{ url_for("create_plaid_link_token") }}', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrfToken },
          credentials: 'same-origin',
          body: JSON.stringify(plaidItemId ? { item_id: plaidItemId, csrf_token: csrfToken } : { csrf_token: csrfToken })
        });
        const tokenPayload = await tokenResponse.json();
        if (!tokenResponse.ok || !tokenPayload.link_token) {
          throw new Error(tokenPayload.error || 'Could not start Plaid Link.');
        }

        const handler = window.Plaid.create({
          token: tokenPayload.link_token,
          onSuccess: async function(public_token, metadata) {
            if (plaidItemId) {
              const reconnectResponse = await fetch(`/plaid/items/${plaidItemId}/reconnect-complete`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrfToken },
                credentials: 'same-origin',
                body: JSON.stringify({ metadata, csrf_token: csrfToken })
              });
              const reconnectPayload = await reconnectResponse.json();
              if (!reconnectResponse.ok || !reconnectPayload.ok) {
                throw new Error(reconnectPayload.error || 'Could not reconnect that bank.');
              }
            } else {
              const exchangeResponse = await fetch('{{ url_for("exchange_plaid_public_token") }}', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrfToken },
                credentials: 'same-origin',
                body: JSON.stringify({ public_token, metadata, csrf_token: csrfToken })
              });
              const exchangePayload = await exchangeResponse.json();
              if (!exchangeResponse.ok || !exchangePayload.ok) {
                throw new Error(exchangePayload.error || 'Could not finish bank connection.');
              }
              window.sessionStorage.setItem(
                connectFeedbackStorageKey,
                JSON.stringify(buildConnectFeedbackMessage(exchangePayload))
              );
            }
            window.location.reload();
          },
          onExit: function() {
            setConnectLoading(false);
          }
        });

        handler.open();
      } catch (error) {
        alert(error.message || 'Could not start bank connection.');
        setConnectLoading(false);
      }
    };

    connectBankButtons.forEach((button) => {
      if (!button.disabled && !button.dataset.plaidBound) {
        button.dataset.plaidBound = 'true';
        button.addEventListener('click', openPlaid);
      }
    });
  })();
</script>
